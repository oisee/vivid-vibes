});if(!s||!s.transition)return null;var tr=s.transition,len=s.end_bar-s.start_bar,barInScene=bar-s.start_bar,beatLen=tr.beats||2,beatBars=beatLen/4;if(tr.mode==='pre'){var preStart=len-beatBars;if(barInScene>=preStart){var p=(barInScene-preStart+bp)/beatBars;return{type:tr.type,progress:Math.min(1,p),phase:'out'};}}if(tr.mode==='post'){if(barInScene<beatBars){var p=(barInScene+bp)/beatBars;return{type:tr.type,progress:Math.min(1,p),phase:'in'};}}return null;},applyPre:function(ctx,st){if(!st)return;var p=st.progress,cx=320,cy=200;ctx.save();if(st.type==='shrink'){var sc=st.phase==='out'?1-p*0.3:0.7+p*0.3;ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);}if(st.type==='iris'){var r=st.phase==='out'?400*(1-p):400*p;ctx.beginPath();ctx.arc(cx,cy,Math.max(1,r),0,Math.PI*2);ctx.clip();}if(st.type==='diamond'){var sz=st.phase==='out'?400*(1-p):400*p;ctx.beginPath();ctx.moveTo(cx,cy-sz);ctx.lineTo(cx+sz,cy);ctx.lineTo(cx,cy+sz);ctx.lineTo(cx-sz,cy);ctx.closePath();ctx.clip();}if(st.type==='wipe-left'){var w=st.phase==='out'?640*(1-p):640*p;ctx.beginPath();ctx.rect(0,0,w,400);ctx.clip();}if(st.type==='wipe-right'){var w=st.phase==='out'?640*(1-p):640*p;ctx.beginPath();ctx.rect(640-w,0,w,400);ctx.clip();}},applyPost:function(ctx,st){if(!st)return;ctx.restore();var p=st.progress;if(st.type==='fade'){var a=st.phase==='out'?p:1-p;ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,640,400);}if(st.type==='flash'){var a=st.phase==='out'?1-p:p;a=a*0.8;ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fillRect(0,0,640,400);}if(st.type==='pixelate'&&p>0.1){var ps=Math.floor(2+p*20);ctx.imageSmoothingEnabled=false;var tmp=document.createElement('canvas');tmp.width=640/ps;tmp.height=400/ps;var tc=tmp.getContext('2d');tc.drawImage(ctx.canvas,0,0,tmp.width,tmp.height);ctx.clearRect(0,0,640,400);ctx.drawImage(tmp,0,0,640,400);}}};function updateHUD(d){lastFrameData=d;var db=d.debug||{};tick=Math.round(au.currentTime/SEC_PER_TICK);var gf=Math.round(tick*SEC_PER_TICK*FPS);document.getE
